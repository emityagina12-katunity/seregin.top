<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коллеги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>


  :root{
    --bg: #f5f5f0;
    --bg-2: #f0efe8;
    --ink: #23261f;
    --muted: #52564a;
    --line: rgba(35,38,31,0.14);
    --sage: #3e8813;
    --sage-soft: rgba(62,136,19,0.14);
    --gold: #b8863d;
    --gold-soft: rgba(184,134,61,0.18);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #stage{
    position:relative;
    width:100%; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding: 8vh 6vw;
    cursor:pointer;
    background:
      radial-gradient(ellipse 70% 60% at 50% 15%, var(--bg-2), transparent 60%),
      radial-gradient(ellipse 42% 28% at 18% 72%, rgba(62,136,19,0.025), transparent 72%),
      radial-gradient(ellipse 36% 30% at 84% 34%, rgba(184,134,61,0.018), transparent 74%),
      radial-gradient(ellipse 58% 24% at 56% 96%, rgba(35,38,31,0.012), transparent 78%),
      var(--bg);
  }

  #stage.no-click{ cursor:default; }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 1.4rem;
    padding: 8vh 6vw;
    opacity:0;
    transform: translateY(14px);
    transition: opacity 1s ease, transform 1s ease;
    pointer-events:none;
  }
  .scene.active{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
  }

  .line-text{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:italic;
    font-size: clamp(1.5rem, 4.4vw, 2.7rem);
    line-height:1.4;
    max-width: 18ch;
    color:var(--ink);
  }
  .line-text.emphasis{
    font-weight:500;
    color:var(--sage);
  }
  .line-svg.emphasis{ font-size:105%; }
  .line-svg.line-climax{ font-size:123%; }

  .line-scene{
    transform: translateY(0);
  }
  .line-scene.active{
    transform: translateY(0);
  }
  .line-svg-wrap{
    width: min(100%, 18ch);
    font-family:'Fraunces', serif;
    font-size: clamp(1.5rem, 4.4vw, 2.7rem);
    line-height:1.4;
  }
  .line-svg{
    display:block;
    width:100%;
    height:calc(var(--line-count) * 1.4em);
    overflow:visible;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
  }
  .line-svg.emphasis{ font-weight:500; }
  .line-svg text{ dominant-baseline:middle; font-size:100px; }

  .hint{
    font-family:'Inter', sans-serif;
    font-size: 1rem;
    letter-spacing:.02em;
    color:var(--muted);
    opacity:.9;
  }

  .cta{
    font-family:'Inter', sans-serif;
    font-size: calc(1.03rem + 3px);
    color: var(--ink);
    border:0;
    padding: 0.78rem 0.52rem;
    background: transparent;
    cursor:pointer;
    transition: color .25s ease;
  }
  .cta::after{
    content:'→';
    display:inline-block;
    margin-left:.45em;
    transition: color .25s ease;
  }
  .cta:hover{
    color: var(--sage);
  }


  .back-btn,
  .next-btn{
    position: fixed;
    top: 20px;
    z-index: 25;
    font-family:'Inter', sans-serif;
    font-size: calc(0.95rem + 3px);
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0.72rem 0.78rem;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease, color .25s ease;
  }
  .back-btn{ left: 20px; }
  .next-btn{ right: 20px; }
  .back-btn.show,
  .next-btn.show{ opacity: .9; pointer-events: auto; }
  .back-btn:hover, .back-btn:focus-visible,
  .next-btn:hover, .next-btn:focus-visible{ color: var(--sage); opacity: 1; }


  @media (max-width: 699px){
    .cta{
      font-size: 0.94rem;
      padding: 0.60rem 0.40rem;
    }
    .back-btn,
    .next-btn{
      font-size: 0.84rem;
      padding: 0.56rem 0.58rem;
    }
  }


  #progress{
    position:fixed;
    bottom: 22px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:6px;
    z-index:20;
  }
  #progress span{
    width:4px; height:4px; border-radius:50%;
    background: var(--line);
    opacity:.65;
    transition: background .3s ease, transform .3s ease;
  }
  #progress span.done{ background: var(--muted); opacity:.72; }
  #progress span.current{ background: var(--sage); opacity:.9; transform: scale(1.45); }


  .wordcloud-title{
    transform: translateY(var(--cloud-offset-y, 0px));
    will-change: transform;
    transition: transform .35s ease;
  }
  .cloud-wrap{
    display:flex; flex-wrap:wrap;
    gap: 0.82rem 1.38rem;
    justify-content:center;
    max-width: 700px;
    transform: translateY(var(--cloud-offset-y, 0px));
    will-change: transform;
    transition: transform .35s ease;
  }
  .cloud-word{
    font-family:'Fraunces', serif;
    font-style:italic;
    cursor:pointer;
    position:relative;
    padding: 0.1rem 0.15rem;
    color: var(--ink);
    background: transparent;
    transition: color .25s ease;
    user-select:none;
  }
  .cloud-word:hover, .cloud-word.opened{
    color: var(--sage);
  }
  .cloud-word::after{
    content:'';
    position:absolute;
    left:5%; right:3%; bottom:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--sage) 18%, var(--sage) 78%, transparent);
    opacity:0;
    transform:rotate(-1deg);
    transition:opacity .25s ease;
  }
  .cloud-word:hover::after, .cloud-word.opened::after{
    opacity:.8;
  }
  .cloud-word:nth-child(1){ font-size: calc(clamp(1.18rem,3.2vw,1.72rem) + 3px); transform: rotate(-2deg); }
  .cloud-word:nth-child(2){ font-size: calc(clamp(1.4rem,3.85vw,2.04rem) + 3px); transform: rotate(1.5deg); }
  .cloud-word:nth-child(3){ font-size: calc(clamp(1.03rem,2.8vw,1.4rem) + 3px); transform: rotate(-1deg); }
  .cloud-word:nth-child(4){ font-size: calc(clamp(1.3rem,3.45vw,1.83rem) + 3px); transform: rotate(2deg); }
  .cloud-word:nth-child(5){ font-size: calc(clamp(1.08rem,3vw,1.51rem) + 3px); transform: rotate(-2.5deg); }
  .cloud-word:nth-child(6){ font-size: calc(clamp(1.13rem,3.1vw,1.62rem) + 3px); transform: rotate(1deg); }
  .cloud-word:nth-child(7){ font-size: calc(clamp(1.35rem,3.65vw,1.94rem) + 3px); transform: rotate(-1.5deg); }


  .cloud-quote{
    display:grid;
    place-items:center;
    width:min(90vw, 34ch);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    font-size: 1.12rem;
    line-height:1.45;
    letter-spacing:.01em;
    color: var(--muted);
    margin: .65rem 0 .75rem;
    text-align:center;
  }

  .cloud-quote-layer{
    grid-area:1 / 1;
    width:100%;
    visibility:hidden;
    opacity:0;
    pointer-events:none;
  }

  .cloud-quote-word{
    display:inline-block;
    white-space:nowrap;
  }

  .cloud-quote-char{
    opacity:0;
  }

  .cloud-quote-caret{
    display:inline-block;
    margin-left:.08em;
    color:var(--sage);
    animation:terminal-caret .8s steps(1,end) infinite;
  }

  @keyframes terminal-caret{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  .continue-wrap{
    min-height: 44px;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition: opacity .9s ease;
  }
  .continue-wrap.show{ opacity:1; }


  .continue-wrap.pinned{
    position:absolute;
    left:0; right:0; bottom: 38px;
    margin:0;
  }


  .scatter-zone{
    position:absolute;
    left:4%; right:4%;
    top:4%; bottom: 108px;
  }
  @media (max-width: 511px){

    .scatter-zone{ bottom: 78px; }
  }
  .scatter-outer{
    position:absolute;
    transform-origin:50% 50%;
    will-change: transform;
  }
  .scatter-outer{
    --writing-outline-size: 1.6px;
  }
  .scatter-outer .scatter-svg{
    overflow:visible;
    filter:
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent)
      drop-shadow(0 0 0 transparent);
    transition:filter .26s ease;
  }
  .scatter-outer.is-writing{
    z-index:1000;
  }
  .scatter-outer.has-outline .scatter-svg{
    filter:
      drop-shadow(var(--writing-outline-size) 0 0 var(--bg))
      drop-shadow(calc(var(--writing-outline-size) * -1) 0 0 var(--bg))
      drop-shadow(0 var(--writing-outline-size) 0 var(--bg))
      drop-shadow(0 calc(var(--writing-outline-size) * -1) 0 var(--bg))
      drop-shadow(1.1px 1.1px 0 var(--bg))
      drop-shadow(-1.1px 1.1px 0 var(--bg))
      drop-shadow(1.1px -1.1px 0 var(--bg))
      drop-shadow(-1.1px -1.1px 0 var(--bg));
    transition-delay:.08s;
  }
  .scatter-inner{
    display:inline-block;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    white-space:nowrap;
    animation-name: drift-idle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  .scatter-inner--center-shimmer .scatter-svg tspan{
    animation: scatter-center-shimmer 4.8s ease-in-out infinite;
  }
  @keyframes scatter-center-shimmer{
    0%,100%{ fill: var(--sage); }
    30%{ fill: var(--sage); }
    58%{ fill: var(--gold); }
    82%{ fill: var(--sage); }
  }


  .scatter-inner--capsule-center-shimmer .scatter-svg tspan{
    animation: scatter-capsule-center-shimmer 4.2s ease-in-out infinite;
  }
  @keyframes scatter-capsule-center-shimmer{
    0%,100%{ fill: var(--gold); }
    14%,40%{ fill: var(--sage); }
    54%{ fill: var(--ink); }
    66%,92%{ fill: var(--sage); }
  }
  @keyframes drift-idle{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-2px); }
  }


  .capsule-ambient{
    position:absolute;
    inset: 8%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, var(--gold-soft), transparent 70%);
    filter: blur(18px);
    opacity:.38;
    animation: capsule-pulse 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes capsule-pulse{
    0%,100%{ opacity:.28; transform: scale(1); }
    50%{ opacity:.42; transform: scale(1.015); }
  }
  .capsule-lead{
    position:absolute;
    top:50%;
    left:50%;
    width:88%;
    color:var(--ink);
    z-index:1001;
    pointer-events:none;
    transform-origin:50% 0;
  }
  .capsule-lead .scatter-svg{
    display:block;
    margin:0 auto;
    overflow:visible;
  }
  .capsule-zone{ top: 22%; }


  .final-lines{
    display:flex; flex-direction:column; gap: .5rem;
    z-index:2;
  }
  .final-title-wrap{
    width:min(100%, 30ch);
    font-size:clamp(2rem, 5vw, 3.2rem);
    line-height:1.25;
  }
  .line-svg.line-final{
    font-size:100%;
    font-weight:500;
  }
  .final-sub{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    color: var(--muted);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .final-sub.show{
    opacity:1;
    transform:translateY(0);
  }
  .final-sign{
    margin-top: 1.6rem;
    font-family:'Inter', sans-serif;
    font-size: 0.95rem;
    letter-spacing: .04em;
    color: var(--sage);
    opacity:0;
    transform:translateY(3px);
    transition:opacity .65s ease, transform .65s ease;
  }
  .final-sign.show{
    opacity:1;
    transform:translateY(0);
  }
  .final-flourish{
    width:120px;
    height:24px;
    margin:.15rem auto 0;
    overflow:visible;
    opacity:0;
    transition:opacity .5s ease;
  }
  .final-flourish path{
    fill:none;
    stroke:var(--sage);
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-dasharray:130;
    stroke-dashoffset:130;
    transition:stroke-dashoffset .8s ease;
  }
  .final-flourish.show{ opacity:.8; }
  .final-flourish.show path{ stroke-dashoffset:0; }
  .replay{
    opacity:0;
    transition:opacity .65s ease;
  }
  .replay.show{
    opacity:.85;
  }
  .replay{
    margin-top: 2.2rem;
    font-family:'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor:pointer;
    background:none; border:none;
  }
  .replay:hover{ opacity:1; color: var(--sage); }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<button id="backBtn" class="back-btn" aria-label="Назад">← назад</button>
<button id="nextBtn" class="next-btn" aria-label="Дальше">дальше →</button>
<div id="progress"></div>
<div id="stage"></div>

<script>
/* ============================================================
   ТЕКСТ САЙТА — редактируйте свободно
   Меняйте только то, что находится между кавычками ' '.
   Ничего больше в этом файле трогать не нужно.
   ============================================================ */

const SEQUENCE = [
  { type:'line', text:'"Коллеги..."', cta:'Угадаешь, что дальше?' },

  { type:'phrasecloud' },

  { type:'line', text:'Кажется, мы знаем эти фразы' },
  { type:'line', text:'Мы очень хорошо их знаем :)', emphasis:true },

  { type:'line', text:'Но за всеми этими короткими сообщениями мы все замечаем кое-что ещё' },

  { type:'wordcloud' },

  { type:'line', text:'Ты часто называешь нас коллегами' },
  { type:'line', text:'Но мы знаем, что за этим словом для тебя стоит что-то большее' },
  { type:'line', text:'Ты хочешь, чтобы мы были не просто людьми, которые работают вместе' },
  { type:'line', text:'Чтобы мы помогали друг другу' },
  { type:'line', text:'Поддерживали' },
  { type:'line', text:'Замечали друг друга' },
  { type:'line', text:'Оставались людьми даже тогда, когда работа заканчивается' },
  { type:'line', text:'Ты хочешь, чтобы мы стали сообществом' },
  { type:'line', text:'Мы знаем, какими ты хочешь видеть нас' },
  { type:'line', text:'И, наверное, именно поэтому нам хочется сказать тебе...' },

  { type:'capsule' },

  { type:'final' }

// "Клубок" типовых рабочих фраз.
const PHRASE_CLOUD = [
  'Ок, спасибо',
  'Помощь нужна?',
  'Да, норм',
  'Сейчас от меня что-то ещё нужно?',
  'Ок, подумаю, спасибо',
  'Ок, сделаю',
  'Доки подписал',
  'Да, давай так',
  'Я бы сделал так...',
  'Побуду с этим',
  'Я бы предложил...',
  'Мне кажется, то, что нужно',
  'Спасибо тебе',
  'Здорово',
  'Как думаешь, когда сможешь сделать?',
  'Класс',
  'Ок, посмотрю',
  'Подхватишь задачу?',

  'Что скажешь?',
];

// Слова в "облаке качеств" и фраза, которая появляется при нажатии.
const CLOUD_WORDS = [
  { word:'внимание',      quote:'Ты всегда замечаешь то, что другие пропускают' },
  { word:'поддержка',     quote:'«Помощь нужна?» — и это не для галочки' },
  { word:'справедливость',quote:'Ты сначала разбираешься, а потом решаешь' },
  { word:'доброта',       quote:'Ты выбираешь по-человечески даже в мелочах' },
  { word:'юмор',          quote:'Ты умеешь разрядить самый напряжённый момент' },
  { word:'тактичность',   quote:'Ты знаешь, когда промолчать, а когда сказать' },
  { word:'помощь',        quote:'Даже когда вопрос вообще не про работу' },
];

// Текст перед капсулой и сами слова-обещания.
const CAPSULE_LEAD = 'Пожалуйста, никогда не переставай...';
const CAPSULE_WORDS = [
  '...помогать',
  '...замечать',
  '...верить в людей',
  '...проявлять желание вникнуть в проблему и прийти на помощь',

  '...танцевать',

  '...давать позитивную обратную связь',
  '...поддерживать тех, кто встречается на твоём пути',
  '...искать новые контакты',
  '...развиваться',
  '...быть таким коммуникабельным, тактичным и неравнодушным',
  '...оставаться собой',
];

// Последний экран.
const FINAL = {
  title: 'С днём рождения, Анатолий',
  sub: 'Спасибо, что ты именно такой',
  sign: '— твоя команда Толк Ай Ти'
};

// Значения — десятичные множители скорости анимации.
// Чем больше значение, тем быстрее анимация: 1.0 — обычная текущая скорость,
// 1.5 — в полтора раза быстрее, 2.0 — в два раза быстрее. Значения меньше 1.0 замедляют анимацию.
const ANIMATION_SPEED = {
  lineWriting: 5.0, // Скорость обычных центральных экранов и всех элементов SEQUENCE с type:'line'.
  scatterWriting: 5.0, // Скорость написания в центре фраз из PHRASE_CLOUD и CAPSULE_WORDS.
  scatterMoving: 0.3 // Скорость движения готовой фразы из PHRASE_CLOUD или CAPSULE_WORDS к финальной позиции.
};


const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
let index = 0;
let lineTimeline = null;
let scatterTimeline = null;
let wordcloudTimeline = null;
let finalTimeline = null;


let preparedPhrasecloud = null;
let phrasecloudPrepareGeneration = 0;
let phrasecloudResizeTimer = null;

function getPhrasecloudViewportKey(){
  return `${Math.max(window.innerWidth || document.documentElement.clientWidth || 0, 1)}x${Math.max(window.innerHeight || document.documentElement.clientHeight || 0, 1)}`;
}

function cancelPreparedPhrasecloud(){
  phrasecloudPrepareGeneration++;
  if(preparedPhrasecloud?.timeline){
    preparedPhrasecloud.timeline.kill();
  }
  if(preparedPhrasecloud?.scene?.isConnected){
    preparedPhrasecloud.scene.remove();
  }
  preparedPhrasecloud = null;
}

function wrapLineText(text, maxChars = 18){
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  words.forEach((word)=>{
    const candidate = line ? line + ' ' + word : word;
    if(line && candidate.length > maxChars){
      lines.push(line);
      line = word;
    } else {
      line = candidate;
    }
  });
  if(line) lines.push(line);
  return lines;
}

function buildLineSvg(item){
  const ns = 'http://www.w3.org/2000/svg';
  const lines = wrapLineText(item.text);
  const svg = document.createElementNS(ns, 'svg');
  const climax = item.text === 'И, наверное, именно поэтому нам хочется сказать тебе...';
  svg.className.baseVal = `line-svg ${item.emphasis ? 'emphasis' : ''} ${climax ? 'line-climax' : ''}`;
  svg.setAttribute('viewBox', `0 0 1000 ${lines.length * 100}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', item.text);
  svg.style.setProperty('--line-count', lines.length);

  const characters = [];
  lines.forEach((line, lineIndex)=>{
    const textNode = document.createElementNS(ns, 'text');
    textNode.setAttribute('x', '500');
    textNode.setAttribute('y', String(lineIndex * 100 + 50));
    textNode.setAttribute('text-anchor', 'middle');
    textNode.setAttribute('fill', 'transparent');
    [...line].forEach((character)=>{
      const tspan = document.createElementNS(ns, 'tspan');
      tspan.textContent = character;
      tspan.style.visibility = 'hidden';
      tspan.style.opacity = '0';
      tspan.style.strokeOpacity = '0';
      tspan.style.fillOpacity = '0';
      textNode.appendChild(tspan);
      if(character !== ' ') characters.push(tspan);
    });
    svg.appendChild(textNode);
  });
  return {svg, characters};
}

function showStaticLine(line){
  const color = line.svg.classList.contains('emphasis') ? 'var(--sage)' : 'var(--ink)';
  line.characters.forEach((character)=>{
    character.style.visibility = 'visible';
    character.style.opacity = '1';
    character.style.fill = color;
    character.style.stroke = 'none';
    character.style.strokeOpacity = '1';
    character.style.fillOpacity = '1';
    character.style.strokeDasharray = 'none';
    character.style.strokeDashoffset = '0';
  });
}

function animateLine(line, hint, onComplete = null){
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!window.gsap || reducedMotion){
    showStaticLine(line);
    if(hint) hint.style.opacity = '.9';
    if(onComplete) onComplete();
    return;
  }

  const color = line.svg.classList.contains('emphasis') ? 'var(--sage)' : 'var(--ink)';
  line.characters.forEach((character)=>{
    const length = Math.max(character.getComputedTextLength(), 1);
    character.style.visibility = 'hidden';
    character.style.opacity = '0';
    character.style.fill = 'transparent';
    character.style.stroke = color;
    character.style.strokeOpacity = '0';
    character.style.fillOpacity = '0';
    character.style.strokeWidth = '.8';
    character.style.paintOrder = 'stroke';
    character.style.strokeDasharray = `${length} ${length}`;
    character.style.strokeDashoffset = String(length);
  });

  const timeline = gsap.timeline({onComplete:()=>{
    if(hint) gsap.to(hint, {opacity:.9, y:0, duration:.28, ease:'power1.out'});
    if(onComplete) onComplete();
  }});

  const speed = Math.max(Number(ANIMATION_SPEED.lineWriting) || 1, 0.1);
  const strokeDuration = .18 / speed;
  const fillDuration = .08 / speed;
  const fillStartOffset = .14 / speed;
  const characterDuration = fillStartOffset + fillDuration;
  line.characters.forEach((character, characterIndex)=>{
    const start = characterIndex * characterDuration;
    timeline.set(character, {visibility:'visible', opacity:1, strokeOpacity:1, fillOpacity:0}, start);
    timeline.to(character, {strokeDashoffset:0, duration:strokeDuration, ease:'none'}, start);
    timeline.to(character, {fill:color, fillOpacity:1, strokeOpacity:0, duration:fillDuration, ease:'power1.out'}, start + fillStartOffset);
  });
  lineTimeline = timeline;
}
